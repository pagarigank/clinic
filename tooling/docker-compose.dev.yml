version: "3.9"

# Development stack (todo.md Phase 0.1): Postgres 17, Redis (cache), MinIO,
# Mailpit, optional LIS simulator.
#   docker compose -f tooling/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: clinic_postgres
    environment:
      POSTGRES_USER: clinic_owner
      POSTGRES_PASSWORD: clinic_owner_dev
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_owner -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: clinic_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinic_minio
      MINIO_ROOT_PASSWORD: clinic_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clinic_minio_data:/data

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 clinic_minio clinic_minio_dev) do sleep 2; done;
      mc mb --ignore-existing local/clinic-dev;
      exit 0
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: clinic_mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  # Optional LIS simulator (HL7 v2 sender) — start explicitly:
  #   docker compose -f tooling/docker-compose.dev.yml up lis-simulator
  lis-simulator:
    image: ghcr.io/clinic-platform/lis-simulator:dev
    profiles: ["lis"]
    container_name: clinic_lis_sim
    environment:
      HL7_TARGET: host.docker.internal:2515
    depends_on:
      - postgres

volumes:
  clinic_pgdata:
  clinic_minio_data:
