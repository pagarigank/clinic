name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic_owner
          POSTGRES_PASSWORD: clinic_owner_dev
          POSTGRES_DB: clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_owner -d clinic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL_MIGRATOR: postgres://clinic_owner:clinic_owner_dev@localhost:5432/clinic
      DATABASE_URL_APP: postgres://clinic_app:clinic_app_dev@localhost:5432/clinic

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Boundary lint fixtures (violations must fail)
        run: pnpm test:boundaries

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Contracts → OpenAPI → types
        run: pnpm --filter @clinic/contracts build

      - name: Migrations (up)
        run: pnpm db:migrate

      - name: Migrations (down → up proves rollback cleanly)
        run: pnpm db:rollback --all && pnpm db:migrate

      - name: Seeds
        run: pnpm db:seed

      # Role grants from the §2.2/§2.3 system-role templates. The permission
      # catalogue itself is versioned by migration 0007, so this only supplies
      # the per-tenant role_permissions the RBAC integration tests read.
      - name: Seed system-role grants
        run: pnpm db:seed:permissions

      - name: Unit + integration tests
        run: pnpm test

      # todo 0.5 — coverage gates. Two separate invocations because vitest
      # applies a threshold to the aggregate of whatever is included, so a
      # shared 90% bar and a feature 60% bar cannot live in one run.
      # Ratchet upward; never lower these without an ADR.
      - name: Coverage gate (shared packages, 90%)
        run: pnpm test:coverage

      - name: Coverage gate (features, ratcheted)
        run: pnpm test:coverage:apps

      # todo 0.5 — pinned versions asserted. A floating range in a published
      # workspace package is a supply-chain hole: the lockfile can be updated
      # without review and CI keeps passing.
      - name: Assert exact pinned versions
        run: pnpm assert:pinned

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-banner --redact

      - name: Build
        run: pnpm -r --if-present build
